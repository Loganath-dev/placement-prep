        - generic [ref=e178]:
          - heading "4. Purposes and Lawful Basis of Processing" [level=2] [ref=e179]
          - paragraph [ref=e180]:
            - text: We process your personal data on the basis of your
            - strong [ref=e181]: consent
            - text: and, where applicable, the
            - strong [ref=e182]: legitimate uses
            - text: "permitted under Section 7 of the DPDP Act, 2023. We use your data to:"
          - list [ref=e183]:
            - listitem [ref=e184]:
              - img [ref=e185]
              - generic [ref=e187]: Create and manage your account and authenticate you securely.
            - listitem [ref=e188]:
              - img [ref=e189]
              - generic [ref=e191]: Personalise your preparation, compute your PRI and estimated placement probability, and recommend chapters, practice and mocks.
            - listitem [ref=e192]:
              - img [ref=e193]
              - generic [ref=e195]: Operate gamification features (XP, levels, streaks, badges) and analytics (weakest/strongest topics).
            - listitem [ref=e196]:
              - img [ref=e197]
              - generic [ref=e199]: Process subscriptions and provide customer support.
            - listitem [ref=e200]:
              - img [ref=e201]
              - generic [ref=e203]: Maintain security, prevent fraud and abuse, and debug and improve the Platform.
            - listitem [ref=e204]:
              - img [ref=e205]
              - generic [ref=e207]: Send service communications and, only with your consent, product updates. You can opt out of non-essential communications at any time.
            - listitem [ref=e208]:
              - img [ref=e209]
              - generic [ref=e211]: Comply with applicable law and respond to lawful requests.
          - paragraph [ref=e212]:
            - text: We do
            - strong [ref=e213]: not
            - text: sell your personal data, and we do
            - strong [ref=e214]: not
            - text: use your data for automated decisions that produce legal or similarly significant effects on you. Your PRI and placement probability are study aids and
            - strong [ref=e215]: estimates only
            - text: ", not determinations about your employability."
        - generic [ref=e216]:
          - heading "5. Consent and Its Withdrawal" [level=2] [ref=e217]
          - paragraph [ref=e218]:
            - text: Your consent is free, specific, informed, unconditional and unambiguous, given through clear affirmative action when you sign up and use specific features. You may
            - strong [ref=e219]: withdraw your consent
            - text: at any time, with the same ease with which it was given, by changing settings, emailing privacy@placeready.app, or deleting your account from Settings.
          - paragraph [ref=e220]: Withdrawing consent will not affect the lawfulness of processing carried out before withdrawal. Some features may stop working if the underlying data can no longer be processed.
        - generic [ref=e221]:
          - heading "6. Children's and Students' Data" [level=2] [ref=e222]
          - paragraph [ref=e223]:
            - text: The Platform is intended for college students and job-seekers. Under Section 9 of the DPDP Act, 2023, where a User is a
            - strong [ref=e224]: child (below 18 years of age)
            - text: ", we will process personal data only after obtaining"
            - strong [ref=e225]: verifiable consent from a parent or lawful guardian
            - text: ", and we will not undertake tracking, behavioural monitoring or targeted advertising directed at children, nor any processing likely to cause harm to a child."
          - paragraph [ref=e226]: If you are below 18, please use the Platform only with the involvement and consent of your parent or guardian. If we learn that we have collected a child's data without the required consent, we will delete it promptly.
        - generic [ref=e227]:
          - heading "7. Cookies and Similar Technologies" [level=2] [ref=e228]
          - paragraph [ref=e229]: We use strictly necessary cookies to keep you signed in and to secure sessions, and limited functional/analytics cookies to understand and improve usage. You can control cookies through your browser settings; disabling essential cookies may break sign-in and core features.
