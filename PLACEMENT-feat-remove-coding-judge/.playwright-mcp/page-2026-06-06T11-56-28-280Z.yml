            - listitem [ref=e249]:
              - img [ref=e250]
              - generic [ref=e252]:
                - strong [ref=e253]: With your consent
                - text: — for any other purpose disclosed to you at the time.
        - generic [ref=e254]:
          - heading "9. Sub-Processors and Cross-Border Transfer" [level=2] [ref=e255]
          - paragraph [ref=e256]: Our infrastructure provider hosts data in a data-centre region (currently the Asia-Pacific / Mumbai region). Where any processing or storage occurs outside India, such transfer is undertaken in accordance with Section 16 of the DPDP Act, 2023 and applicable government notifications, with contractual safeguards requiring our processors to maintain confidentiality and security comparable to those described in this Policy.
        - generic [ref=e257]:
          - heading "10. Data Retention" [level=2] [ref=e258]
          - paragraph [ref=e259]: We retain personal data only for as long as necessary to fulfil the purposes set out in this Policy, to provide the Platform, and to comply with legal, tax and accounting obligations. When you delete your account, we will delete or irreversibly anonymise your personal data within a reasonable period, except where retention is required by law or for the establishment, exercise or defence of legal claims.
        - generic [ref=e260]:
          - heading "11. Security Safeguards" [level=2] [ref=e261]
          - paragraph [ref=e262]: In line with Section 43A of the IT Act, 2000 and the IT Rules, 2011, and the security obligations of the DPDP Act, 2023, we implement reasonable security practices, including encryption of data in transit (HTTPS/TLS) and at rest, hashed passwords, row-level access controls so each User can access only their own records, least-privilege access for staff, and monitoring. No method of transmission or storage is perfectly secure, and we cannot guarantee absolute security; you are responsible for keeping your credentials confidential.
        - generic [ref=e263]:
          - heading "12. Personal Data Breach Notification" [level=2] [ref=e264]
          - paragraph [ref=e265]: In the event of a personal data breach, we will notify the Data Protection Board of India and affected Data Principals as required under the DPDP Act, 2023, and will comply with applicable CERT-In directions (2022) on incident reporting.
