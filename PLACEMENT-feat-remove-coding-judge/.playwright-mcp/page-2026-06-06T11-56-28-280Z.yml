          - list [ref=e233]:
            - listitem [ref=e234]:
              - img [ref=e235]
              - generic [ref=e237]:
                - strong [ref=e238]: Data Processors / service providers
                - text: — engaged under contract to process data on our instructions, including Supabase (cloud hosting, database and authentication), Razorpay (payment processing) and our email/communication providers.
            - listitem [ref=e239]:
              - img [ref=e240]
              - generic [ref=e242]:
                - strong [ref=e243]: Legal and safety
                - text: — where required by law, court order, or a lawful request by a government authority, or to protect the rights, safety and property of PlaceReady, our Users or the public.
            - listitem [ref=e244]:
