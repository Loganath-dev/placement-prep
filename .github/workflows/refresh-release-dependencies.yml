name: Refresh release dependencies

on:
  push:
    branches:
      - chore/root-cleanup-canonical-app
    paths:
      - package.json

permissions:
  contents: write

concurrency:
  group: release-dependency-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/chore/root-cleanup-canonical-app' && !contains(github.event.head_commit.message, '[deps-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/root-cleanup-canonical-app
          persist-credentials: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install existing dependency graph
        run: pnpm install --no-frozen-lockfile

      - name: Upgrade patched framework releases
        run: |
          pnpm add next@16.4.5 react@19.2.9 react-dom@19.2.9
          pnpm add -D eslint-config-next@16.4.5 vitest@4.1.12 vite@8.1.6

      - name: Regenerate lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Update vulnerable transitive packages in the lockfile
        run: pnpm audit --fix=update

      - name: Resolve final lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Commit dependency manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml pnpm-workspace.yaml
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "deps: refresh patched framework and audited transitive packages [deps-refresh]"
          git push origin HEAD:chore/root-cleanup-canonical-app

      - name: Verify patched framework pins
        run: pnpm check:release-deps

      - name: Dependency security audit
        run: pnpm audit --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Unit tests
        run: pnpm test

      - name: Cloudflare OpenNext build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: pnpm build
