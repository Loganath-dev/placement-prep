name: CI

# Release checks run on the default branch and the canonical working branch.
# This ZIP is a local candidate; it is not pushed or deployed by this workflow.

on:
  push:
    branches:
      - chore/root-cleanup-canonical-app
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: .

jobs:
  verify:
    name: Lint, type-check, tests, dependency security and Vercel build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies from the committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Dependency security audit
        run: pnpm audit --audit-level high

      - name: Patched dependency and lockfile gate
        run: pnpm check:release-deps

      - name: Lint
        run: pnpm lint

      - name: Next.js App Router directory
        run: pnpm check:app-directory

      - name: Client/server content boundary
        run: pnpm check:boundaries

      - name: Type-check
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Unit tests
        run: pnpm test

      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: pnpm build

  migrations:
    name: Ordered migration inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify migrations 0001–0036 are present exactly once
        shell: bash
        run: |
          set -euo pipefail
          for number in $(seq 1 36); do
            version=$(printf '%04d' "$number")
            count=$(find supabase/migrations -maxdepth 1 -type f -name "${version}_*.sql" | wc -l)
            if [ "$count" -ne 1 ]; then
              echo "Expected exactly one migration for version $version, found $count"
              exit 1
            fi
          done
