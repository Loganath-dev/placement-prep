name: CI

# Run release checks on the canonical working branch and on pull requests.
# Keep the Cloudflare OpenNext adapter build as the production build target.

on:
  push:
    branches:
      - main
      - chore/root-cleanup-canonical-app
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: .

jobs:
  verify:
    name: Lint, type-check, tests, dependency security and Cloudflare build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency security audit
        run: pnpm audit --audit-level high

      - name: Patched framework dependency gate
        run: pnpm check:release-deps

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Unit tests
        run: pnpm test

      - name: Production build (OpenNext / Cloudflare)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: pnpm build

  migrations:
    name: Migration source inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify ordered migration inventory
        shell: bash
        run: |
          set -euo pipefail
          for number in $(seq 1 36); do
            version=$(printf '%04d' "$number")
            count=$(find supabase/migrations -maxdepth 1 -type f -name "${version}_*.sql" | wc -l)
            if [ "$count" -ne 1 ]; then
              echo "Expected exactly one migration for version $version, found $count"
              exit 1
            fi
          done
